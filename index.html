<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEXUS CMMS · Gestión de Mantenimiento Industrial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js"></script>
<style>
/* ================================================================
   NEXUS CMMS — DESIGN TOKENS
   Paleta: base carbón/pizarra + acento "señal" ámbar-cian (panel de control industrial)
   Tipografía: Inter (UI) + JetBrains Mono (códigos, datos, cifras)
   Firma visual: "indicadores LED" — puntos de estado que laten como
   luces piloto de un tablero de planta, y numeración de OT en mono.
================================================================= */
:root{
  --bg:            #eef1f5;
  --bg-elevated:   #ffffff;
  --bg-inset:      #f5f7fa;
  --sidebar-bg:    #10151f;
  --sidebar-bg-2:  #161d2b;
  --border:        #dde2e9;
  --border-soft:   #e7eaef;
  --text:          #12161f;
  --text-dim:      #5b6472;
  --text-faint:    #8891a0;
  --sidebar-text:  #aab2c2;
  --sidebar-text-active: #ffffff;
  --accent:        #0e7c8f;      /* cian industrial */
  --accent-2:      #f2a339;      /* ámbar señal */
  --accent-soft:   #e3f2f4;
  --ok:            #1a9c6b;
  --ok-soft:       #e2f6ee;
  --warn:          #d98c0f;
  --warn-soft:     #fdf1dd;
  --danger:        #d8443a;
  --danger-soft:   #fbe6e4;
  --info:          #2f6fd6;
  --info-soft:     #e7eefc;
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --shadow-sm: 0 1px 2px rgba(16,21,31,0.06);
  --shadow: 0 4px 16px rgba(16,21,31,0.08);
  --shadow-lg: 0 12px 32px rgba(16,21,31,0.14);
  --sidebar-w: 264px;
  --sidebar-w-collapsed: 76px;
  --topbar-h: 64px;
}

html.dark{
  --bg:            #0b0e14;
  --bg-elevated:   #131824;
  --bg-inset:      #0f1420;
  --sidebar-bg:    #090c12;
  --sidebar-bg-2:  #0d1119;
  --border:        #232b3a;
  --border-soft:   #1a2130;
  --text:          #e7ebf3;
  --text-dim:      #9aa4b8;
  --text-faint:    #626d82;
  --sidebar-text:  #8b94a8;
  --sidebar-text-active: #ffffff;
  --accent:        #22b8d4;
  --accent-2:      #f2a339;
  --accent-soft:   #10333c;
  --ok:            #33c58c;
  --ok-soft:       #103326;
  --warn:          #e2a53a;
  --warn-soft:     #362a10;
  --danger:        #e8685e;
  --danger-soft:   #3a1917;
  --info:          #5b8fee;
  --info-soft:     #16233d;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
  --shadow: 0 4px 16px rgba(0,0,0,0.35);
  --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
}

*,*::before,*::after{ box-sizing: border-box; }
html,body{ height:100%; }
body{
  margin:0;
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  font-size:14px;
  -webkit-font-smoothing:antialiased;
  transition: background .25s ease, color .25s ease;
}
.mono{ font-family:'JetBrains Mono',monospace; }
a{ color:inherit; text-decoration:none; }
button{ font-family:inherit; cursor:pointer; }
ul{ list-style:none; margin:0; padding:0; }
h1,h2,h3,h4,p{ margin:0; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:var(--border); border-radius:8px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ---------------- Layout shell ---------------- */
.app{ display:flex; min-height:100vh; }

.sidebar{
  width:var(--sidebar-w);
  flex-shrink:0;
  background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg-2));
  color:var(--sidebar-text);
  display:flex;
  flex-direction:column;
  position:fixed;
  top:0; left:0; bottom:0;
  z-index:40;
  transition: width .2s ease, transform .2s ease;
  border-right:1px solid rgba(255,255,255,0.04);
}
.app.collapsed .sidebar{ width:var(--sidebar-w-collapsed); }

.sidebar-brand{
  height:var(--topbar-h);
  display:flex; align-items:center; gap:10px;
  padding:0 20px;
  flex-shrink:0;
  border-bottom:1px solid rgba(255,255,255,0.06);
}
.brand-mark{
  width:32px;height:32px;border-radius:8px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 1px rgba(255,255,255,0.08) inset;
}
.brand-mark svg{ width:18px;height:18px; }
.brand-text{ display:flex; flex-direction:column; line-height:1.1; overflow:hidden; white-space:nowrap; }
.brand-text b{ color:#fff; font-size:15px; letter-spacing:0.4px; }
.brand-text span{ font-size:10px; color:var(--sidebar-text); letter-spacing:1.2px; text-transform:uppercase; }
.app.collapsed .brand-text{ display:none; }

.sidebar-scroll{ flex:1; overflow-y:auto; padding:14px 10px 20px; }
.nav-section-label{
  font-size:10px; text-transform:uppercase; letter-spacing:1.2px;
  color:var(--text-faint); padding:14px 12px 6px; font-weight:700;
  white-space:nowrap; overflow:hidden;
}
.app.collapsed .nav-section-label{ opacity:0; height:6px; padding:8px 0 0; }

.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:9px 12px; margin:2px 0;
  border-radius:8px; font-size:13.5px; font-weight:500;
  color:var(--sidebar-text);
  white-space:nowrap; overflow:hidden;
  position:relative;
  transition:background .15s ease, color .15s ease;
}
.nav-item svg{ width:18px; height:18px; flex-shrink:0; opacity:0.85; }
.nav-item:hover{ background:rgba(255,255,255,0.06); color:#fff; }
.nav-item.active{ background:rgba(34,184,212,0.14); color:var(--sidebar-text-active); }
.nav-item.active::before{
  content:''; position:absolute; left:0; top:6px; bottom:6px; width:3px;
  background:var(--accent); border-radius:2px;
}
.nav-item.active svg{ opacity:1; color:var(--accent); }
.nav-item .label{ overflow:hidden; text-overflow:ellipsis; }
.app.collapsed .nav-item .label{ display:none; }
.app.collapsed .nav-item{ justify-content:center; }

.main{
  flex:1;
  margin-left:var(--sidebar-w);
  min-width:0;
  transition:margin-left .2s ease;
  display:flex; flex-direction:column;
}
.app.collapsed .main{ margin-left:var(--sidebar-w-collapsed); }

.topbar{
  height:var(--topbar-h); flex-shrink:0;
  background:var(--bg-elevated);
  border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 22px; position:sticky; top:0; z-index:30;
  gap:16px;
}
.topbar-left{ display:flex; align-items:center; gap:14px; min-width:0; }
.icon-btn{
  width:36px;height:36px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-inset); color:var(--text-dim);
  display:flex;align-items:center;justify-content:center; flex-shrink:0;
  transition:.15s;
}
.icon-btn:hover{ border-color:var(--accent); color:var(--accent); }
.icon-btn svg{ width:17px;height:17px; }
.page-title{ font-size:17px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.page-crumb{ font-size:12px; color:var(--text-faint); }

.topbar-right{ display:flex; align-items:center; gap:10px; }
.search-global{
  display:flex; align-items:center; gap:8px;
  background:var(--bg-inset); border:1px solid var(--border);
  border-radius:8px; padding:8px 12px; width:260px;
}
.search-global input{
  border:none; background:transparent; outline:none; color:var(--text);
  font-size:13px; width:100%;
}
.search-global svg{ width:15px;height:15px; color:var(--text-faint); flex-shrink:0; }

.avatar{
  width:36px;height:36px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  display:flex;align-items:center;justify-content:center;
  color:#fff; font-weight:700; font-size:13px; flex-shrink:0;
}
.role-pill{
  font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.5px;
  padding:3px 8px; border-radius:20px; background:var(--accent-soft); color:var(--accent);
}

.content{ padding:24px; flex:1; }

/* ---------------- Generic components ---------------- */
.card{
  background:var(--bg-elevated); border:1px solid var(--border);
  border-radius:var(--radius); box-shadow:var(--shadow-sm);
}
.card-pad{ padding:18px 20px; }

.grid{ display:grid; gap:16px; }
.grid-kpi{ grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
.grid-charts-2{ grid-template-columns:repeat(auto-fit,minmax(380px,1fr)); }
.grid-charts-3{ grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); }

.kpi-card{ padding:18px 18px 16px; display:flex; flex-direction:column; gap:10px; position:relative; overflow:hidden; }
.kpi-top{ display:flex; align-items:flex-start; justify-content:space-between; }
.kpi-icon{ width:38px;height:38px;border-radius:9px; display:flex;align-items:center;justify-content:center; flex-shrink:0; }
.kpi-icon svg{ width:19px;height:19px; }
.kpi-label{ font-size:12px; color:var(--text-dim); font-weight:600; }
.kpi-value{ font-size:26px; font-weight:800; font-family:'JetBrains Mono',monospace; letter-spacing:-0.5px; }
.kpi-unit{ font-size:12px; color:var(--text-faint); font-weight:500; margin-left:4px; }
.kpi-trend{ display:flex; align-items:center; gap:5px; font-size:12px; font-weight:600; }
.kpi-trend svg{ width:13px;height:13px; }
.trend-up{ color:var(--ok); } .trend-down{ color:var(--danger); } .trend-flat{ color:var(--text-faint); }
.led{ width:8px;height:8px;border-radius:50%; flex-shrink:0; box-shadow:0 0 0 3px transparent; animation:pulse 2.2s infinite; }
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 currentColor22; }
  70%{ box-shadow:0 0 0 6px transparent; }
  100%{ box-shadow:0 0 0 0 transparent; }
}
.led-ok{ background:var(--ok); color:var(--ok); }
.led-warn{ background:var(--warn); color:var(--warn); }
.led-danger{ background:var(--danger); color:var(--danger); }

.section-head{ display:flex; align-items:center; justify-content:space-between; margin:28px 0 14px; flex-wrap:wrap; gap:10px; }
.section-head:first-child{ margin-top:0; }
.section-title{ font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px; }
.section-title svg{ width:16px;height:16px; color:var(--accent); }

.chart-card{ padding:18px 20px 10px; }
.chart-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
.chart-head h4{ font-size:13px; font-weight:700; }
.chart-head span{ font-size:11px; color:var(--text-faint); }
.chart-box{ height:230px; }
.chart-box.sm{ height:190px; }

/* Buttons */
.btn{
  display:inline-flex; align-items:center; gap:7px; justify-content:center;
  padding:9px 16px; border-radius:8px; font-size:13px; font-weight:600;
  border:1px solid var(--border); background:var(--bg-elevated); color:var(--text);
  transition:.15s;
}
.btn svg{ width:15px;height:15px; }
.btn:hover{ border-color:var(--accent); color:var(--accent); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ filter:brightness(1.08); color:#fff; }
.btn-danger-ghost{ color:var(--danger); border-color:var(--danger-soft); }
.btn-danger-ghost:hover{ background:var(--danger-soft); border-color:var(--danger); }
.btn-sm{ padding:6px 10px; font-size:12px; }
.btn-icon{ padding:8px; }

/* Toolbar / filters */
.toolbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius);
  padding:12px 14px; margin-bottom:14px;
}
.tb-search{ display:flex;align-items:center;gap:8px; background:var(--bg-inset); border:1px solid var(--border);
  border-radius:8px; padding:8px 12px; min-width:220px; flex:1; max-width:320px; }
.tb-search input{ border:none;background:transparent;outline:none;color:var(--text);font-size:13px;width:100%; }
.tb-search svg{ width:15px;height:15px;color:var(--text-faint); flex-shrink:0; }
.select-field, .input-field{
  padding:8px 10px; border-radius:8px; border:1px solid var(--border);
  background:var(--bg-inset); color:var(--text); font-size:13px; outline:none;
}
.select-field:focus,.input-field:focus,.tb-search:focus-within{ border-color:var(--accent); }
.spacer{ flex:1; }

/* Table */
.table-wrap{ background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
table{ width:100%; border-collapse:collapse; font-size:13px; }
thead th{
  text-align:left; padding:11px 14px; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
  color:var(--text-faint); background:var(--bg-inset); border-bottom:1px solid var(--border);
  white-space:nowrap; cursor:pointer; user-select:none; font-weight:700;
}
thead th:hover{ color:var(--accent); }
thead th .sort-arrow{ opacity:.4; margin-left:4px; font-size:10px; }
tbody td{ padding:11px 14px; border-bottom:1px solid var(--border-soft); white-space:nowrap; color:var(--text); }
tbody tr:last-child td{ border-bottom:none; }
tbody tr:hover{ background:var(--bg-inset); }
.td-actions{ display:flex; gap:6px; }
.row-check{ width:34px; }

.badge{ display:inline-flex; align-items:center; gap:5px; padding:4px 9px; border-radius:20px; font-size:11px; font-weight:700; white-space:nowrap; }
.badge svg{ width:11px;height:11px; }
.badge-ok{ background:var(--ok-soft); color:var(--ok); }
.badge-warn{ background:var(--warn-soft); color:var(--warn); }
.badge-danger{ background:var(--danger-soft); color:var(--danger); }
.badge-info{ background:var(--info-soft); color:var(--info); }
.badge-neutral{ background:var(--bg-inset); color:var(--text-dim); border:1px solid var(--border); }

.table-footer{ display:flex; align-items:center; justify-content:space-between; padding:10px 14px; border-top:1px solid var(--border); flex-wrap:wrap; gap:10px; }
.pagination{ display:flex; align-items:center; gap:6px; }
.page-btn{ width:30px;height:30px; border-radius:6px; border:1px solid var(--border); background:var(--bg-elevated); display:flex;align-items:center;justify-content:center; font-size:12px; color:var(--text-dim); }
.page-btn.active{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
.page-btn:disabled{ opacity:.4; cursor:not-allowed; }
.results-count{ font-size:12px; color:var(--text-faint); }

.empty-state{ text-align:center; padding:50px 20px; color:var(--text-faint); }
.empty-state svg{ width:40px;height:40px; margin-bottom:10px; opacity:.5; }
.empty-state h4{ color:var(--text-dim); font-size:14px; margin-bottom:4px; }
.empty-state p{ font-size:12.5px; }

/* Modal */
.modal-overlay{
  position:fixed; inset:0; background:rgba(8,10,16,0.55); backdrop-filter:blur(2px);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
  opacity:0; pointer-events:none; transition:opacity .15s ease;
}
.modal-overlay.open{ opacity:1; pointer-events:auto; }
.modal{
  background:var(--bg-elevated); border-radius:var(--radius-lg); width:100%; max-width:560px;
  max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); border:1px solid var(--border);
  transform:translateY(12px); transition:transform .15s ease;
}
.modal-overlay.open .modal{ transform:translateY(0); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border); }
.modal-head h3{ font-size:15.5px; font-weight:700; }
.modal-body{ padding:20px 22px; display:flex; flex-direction:column; gap:14px; }
.modal-foot{ display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--border); }

.form-row{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.form-group{ display:flex; flex-direction:column; gap:6px; }
.form-group.full{ grid-column:1 / -1; }
.form-group label{ font-size:12px; font-weight:600; color:var(--text-dim); }
.form-group .req{ color:var(--danger); }
.form-group input, .form-group select, .form-group textarea{
  padding:9px 11px; border-radius:8px; border:1px solid var(--border); background:var(--bg-inset);
  color:var(--text); font-size:13px; outline:none; font-family:inherit; width:100%;
}
.form-group textarea{ resize:vertical; min-height:70px; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus{ border-color:var(--accent); }
.field-error{ font-size:11px; color:var(--danger); display:none; }
.form-group.invalid input, .form-group.invalid select, .form-group.invalid textarea{ border-color:var(--danger); }
.form-group.invalid .field-error{ display:block; }

.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; overflow-x:auto; }
.tab-btn{ padding:10px 14px; font-size:13px; font-weight:600; color:var(--text-dim); border-bottom:2px solid transparent; white-space:nowrap; }
.tab-btn.active{ color:var(--accent); border-color:var(--accent); }

.toast-wrap{ position:fixed; bottom:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{
  background:var(--bg-elevated); border:1px solid var(--border); border-left:3px solid var(--ok);
  padding:12px 16px; border-radius:8px; box-shadow:var(--shadow-lg); font-size:13px; font-weight:500;
  display:flex; align-items:center; gap:10px; min-width:240px; animation:slideIn .2s ease;
}
.toast.danger{ border-left-color:var(--danger); }
.toast svg{ width:16px;height:16px; flex-shrink:0; }
.toast.ok svg{ color:var(--ok); } .toast.danger svg{ color:var(--danger); }
@keyframes slideIn{ from{ opacity:0; transform:translateX(16px);} to{opacity:1; transform:translateX(0);} }

.placeholder-module{ display:flex; flex-direction:column; align-items:center; justify-content:center; padding:70px 20px; text-align:center; color:var(--text-faint); }
.placeholder-module .pm-icon{ width:56px;height:56px; border-radius:14px; background:var(--accent-soft); display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
.placeholder-module .pm-icon svg{ width:26px;height:26px; color:var(--accent); }
.placeholder-module h3{ color:var(--text); font-size:16px; margin-bottom:6px; }
.placeholder-module p{ font-size:13px; max-width:420px; }

.stat-strip{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.stat-chip{ display:flex; align-items:center; gap:8px; padding:8px 12px; border-radius:8px; background:var(--bg-elevated); border:1px solid var(--border); font-size:12.5px; }
.stat-chip b{ font-family:'JetBrains Mono',monospace; }

@media (max-width: 1024px){
  .sidebar{ transform:translateX(-100%); }
  .app.mobile-open .sidebar{ transform:translateX(0); }
  .main{ margin-left:0 !important; }
  .search-global{ display:none; }
  .form-row{ grid-template-columns:1fr; }
}
@media (max-width: 640px){
  .content{ padding:14px; }
  .topbar{ padding:0 12px; }
}
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="toastWrap" class="toast-wrap"></div>
<script>
/* ================================================================
   NEXUS CMMS — ICONOGRAFÍA
   Set propio de íconos de línea (SVG, trazo simple), sin depender
   de librerías externas de íconos.
================================================================= */
const SVG_ATTR = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"';
const ICONS = {
  grid: `<svg ${SVG_ATTR}><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>`,
  clipboard: `<svg ${SVG_ATTR}><rect x="5" y="4" width="14" height="17" rx="2"/><rect x="8.5" y="2" width="7" height="4" rx="1"/><path d="M8.5 11h7M8.5 15h7M8.5 19h4"/></svg>`,
  wrench: `<svg ${SVG_ATTR}><path d="M14.7 6.3a4 4 0 1 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2-2z"/></svg>`,
  activity: `<svg ${SVG_ATTR}><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>`,

/* ================================================================
   PLAN DE MANTENIMIENTO — JUNIO/JULIO 2026
   Genera 60 OT reales (todas completadas), con horario 8:00–16:00,
   inspecciones diarias, y 5 OT correctivas de excepción en Producción.
   Fechas exactas provistas: 8 semanas de 3 días cada una.
================================================================= */
const WEEKS = [
  { n:1, dias:['2026-06-03','2026-06-04','2026-06-05'] },
  { n:2, dias:['2026-06-10','2026-06-11','2026-06-12'] },

  { n:7, dias:['2026-07-15','2026-07-16','2026-07-17'] },
  { n:8, dias:['2026-07-22','2026-07-23','2026-07-24'] },
];
const DATE_TO_WEEK = {};
WEEKS.forEach(w => w.dias.forEach(d => DATE_TO_WEEK[d] = w.n));

const ELEMENTOS_MANT = ['Sellos mecánicos','Ejes','Acoples','Rodamientos','Bandas transportadoras Perfort'];
const DESC_MANTENIMIENTO = 'Se realizan cambios de sellos, ejes, acoples y rodamiento, bandas transportadoras marca Perfort.';
const DESC_INSPECCION = 'Inspección diaria de equipos: recorrido preventivo, verificación de parámetros de operación y detección temprana de anomalías.';
const DESC_FALLA = 'Falla detectada en línea de producción: intervención correctiva inmediata sobre sellos y rodamientos para restablecer la operación.';

function hhmmAdd(hhmm, minutesToAdd){
  const [h,m] = hhmm.split(':').map(Number);
  const total = h*60+m+minutesToAdd;
  const nh = Math.floor(total/60), nm = total%60;
  return String(nh).padStart(2,'0')+':'+String(nm).padStart(2,'0');
}
function durationHours(inicio, fin){
  const [h1,m1] = inicio.split(':').map(Number), [h2,m2] = fin.split(':').map(Number);
  return ((h2*60+m2)-(h1*60+m1))/60;
}

function generarOrdenesJunioJulio(){
  const dias = WEEKS.flatMap(w => w.dias); // 24 días en orden
  const CORRECTIVE_DAY_IDX = [1,6,11,16,21]; // 5 días de excepción (fallos en Producción)
  let otCounter = 0;
  const equiposCiclo = ['e1','e2','e3'];
  const ordenes = [];

  dias.forEach((fecha, dayIdx) => {
    const numOtsHoy = (dayIdx % 2 === 0) ? 3 : 2; // 12 días x3 + 12 días x2 = 60 OT
    const esDiaFalla = CORRECTIVE_DAY_IDX.includes(dayIdx);

    // 1) Inspección diaria (siempre la primera OT del día)
    otCounter++;
    const areaInsp = (dayIdx % 2 === 0) ? 'a1' : 'a2';
    ordenes.push({
      id:newId('ot'), numeroOT:'OT-'+String(otCounter).padStart(5,'0'),
      fecha, horaInicio:'08:00', horaFin:'08:30',
      areaId:areaInsp, equipoId:equiposCiclo[dayIdx%3],
      elemento:'Recorrido general', descripcion:DESC_INSPECCION,
      responsableId:'u2', prioridad:'BAJA', estado:'COMPLETADA', tipoMantenimiento:'PREVENTIVO',
      observaciones:'Inspección diaria — sin hallazgos que reporten paro de equipo.',
    });

    // 2) OT restantes del día (mantenimiento preventivo, salvo 5 días de excepción correctiva)
    const restantes = numOtsHoy - 1;
    const slots = restantes === 2
      ? [ {inicio:'09:30', fin:'11:00'}, {inicio:'13:00', fin:'14:30'} ]
      : [ {inicio:'10:00', fin:'11:30'} ];

    slots.forEach((slot, slotIdx)=>{
      otCounter++;
      const esFallaAqui = esDiaFalla && slotIdx===0; // 1 falla por día de excepción = 5 en total
      const elemento = ELEMENTOS_MANT[otCounter % ELEMENTOS_MANT.length];
      if(esFallaAqui){
        const fin = hhmmAdd(slot.inicio, 120); // fallas toman más tiempo de intervención
        ordenes.push({
          id:newId('ot'), numeroOT:'OT-'+String(otCounter).padStart(5,'0'),
          fecha, horaInicio:slot.inicio, horaFin:fin,
          areaId:'a1', equipoId:equiposCiclo[(otCounter+1)%3],
          elemento, descripcion:DESC_FALLA,
          responsableId:'u3', prioridad:'ALTA', estado:'COMPLETADA', tipoMantenimiento:'CORRECTIVO',
          observaciones:'Falla resuelta el mismo día. Se registró en Incidencias y se generó costo de reparación.',
        });
      } else {
        ordenes.push({
          id:newId('ot'), numeroOT:'OT-'+String(otCounter).padStart(5,'0'),
          fecha, horaInicio:slot.inicio, horaFin:slot.fin,
          areaId: equiposCiclo[otCounter%3]==='e3' ? 'a2' : 'a1',
          equipoId:equiposCiclo[otCounter%3],
          elemento, descripcion:DESC_MANTENIMIENTO,
          responsableId:'u3', prioridad:'MEDIA', estado:'COMPLETADA', tipoMantenimiento:'PREVENTIVO',
          observaciones:'',
        });
      }
    });
  });

  ordenes.forEach(o=>{ o.duracionMinutos = Math.round(durationHours(o.horaInicio,o.horaFin)*60); o.semana = DATE_TO_WEEK[o.fecha]; });
  return ordenes;
}

function generarCostosDeFallas(ordenesFalla){
  return ordenesFalla.map((o,i)=>({
    id:newId('co'), ordenTrabajoId:o.id,
    manoDeObra: 90, materiales: 15 + (i*3), repuestos: 60 + (i*8), serviciosExternos: (i===2? 45:0),
    fecha:o.fecha,
  }));
}

DB.ordenes = generarOrdenesJunioJulio();
DB.costos = generarCostosDeFallas(DB.ordenes.filter(o=>o.tipoMantenimiento==='CORRECTIVO'));

  estadoEstrategia: { PLANIFICADA:'Planificada', EN_EJECUCION:'En ejecución', EN_REVISION:'En revisión', COMPLETADA:'Completada' },
  clausulaISO: {

  },

  estadoAuditoria: { ABIERTA:'Abierta', EN_PROCESO:'En proceso', CERRADA:'Cerrada' },
};
function badgeClassFor(kind, value){
  const map = {
    estadoOT: { PENDIENTE:'badge-neutral', EN_PROGRESO:'badge-info', PAUSADA:'badge-warn', COMPLETADA:'badge-ok', CANCELADA:'badge-danger' },
    prioridad: { BAJA:'badge-neutral', MEDIA:'badge-info', ALTA:'badge-warn', CRITICA:'badge-danger' },
    estadoEquipo: { OPERATIVO:'badge-ok', EN_MANTENIMIENTO:'badge-warn', FUERA_DE_SERVICIO:'badge-danger', DADO_DE_BAJA:'badge-neutral' },
    criticidad: { BAJA:'badge-neutral', MEDIA:'badge-info', ALTA:'badge-danger' },
    estadoIncidencia: { ABIERTA:'badge-danger', EN_REVISION:'badge-warn', RESUELTA:'badge-ok', CERRADA:'badge-neutral' },
    estadoOC: { BORRADOR:'badge-neutral', ENVIADA:'badge-info', APROBADA:'badge-warn', RECIBIDA:'badge-ok', CANCELADA:'badge-danger' },
    estadoEstrategia: { PLANIFICADA:'badge-neutral', EN_EJECUCION:'badge-info', EN_REVISION:'badge-warn', COMPLETADA:'badge-ok' },
    cumplimientoISO: { CONFORME:'badge-ok', OBSERVACION:'badge-warn', NO_CONFORME:'badge-danger' },
    estadoAuditoria: { ABIERTA:'badge-danger', EN_PROCESO:'badge-warn', CERRADA:'badge-ok' },
  };
  return (map[kind] && map[kind][value]) || 'badge-neutral';
}
function badge(kind, value){
  if(!value) return '';
  const text = (LABELS[kind] && LABELS[kind][value]) || value;
  return `<span class="badge ${badgeClassFor(kind,value)}">${text}</span>`;
}

<script>
/* ================================================================
   NEXUS CMMS — ESTADO GLOBAL, NAVEGACIÓN Y UTILIDADES
================================================================= */
const STATE = {
  route: 'dashboard',
  sidebarCollapsed: false,
  mobileOpen: false,
  theme: 'light',
  user: { nombre:'Ana Gómez', rol:'ADMINISTRADOR' },
  tables: {}, // per-module: { search, filters:{}, sortKey, sortDir, page, pageSize, selected:Set }
};

const NAV = [

  ]},

    { id:'equipos', label:'Equipos', icon:'cpu' },

/* ---------- Formatters ---------- */
function fmtMoney(n){ return '$' + Number(n||0).toLocaleString('es-PA',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtNum(n, d=0){ return Number(n||0).toLocaleString('es-PA',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtDate(s){ if(!s) return '—'; const d = new Date(s+'T00:00:00'); if(isNaN(d)) return s; return d.toLocaleDateString('es-PA',{day:'2-digit',month:'short',year:'numeric'}); }
function fmtDateTime(s){ if(!s) return '—'; return s; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------- Toasts ---------- */
function toast(msg, type='ok'){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast ' + (type==='danger'?'danger':'ok');
  el.innerHTML = (type==='danger'?ICONS.alert:ICONS.checkCircle) + `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s, transform .3s'; el.style.opacity='0'; el.style.transform='translateX(16px)'; setTimeout(()=>el.remove(),300); }, 2800);
}

/* ---------- Modal ---------- */
function openModal(title, bodyHtml, footHtml, opts={}){
  closeModal();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'activeModal';
  overlay.innerHTML = `
    <div class="modal" style="max-width:${opts.width||'560px'}">
      <div class="modal-head">
        <h3>${esc(title)}</h3>
        <button class="icon-btn" onclick="closeModal()">${ICONS.x}</button>
      </div>
      <div class="modal-body">${bodyHtml}</div>
      ${footHtml? `<div class="modal-foot">${footHtml}</div>` : ''}
    </div>`;
  overlay.addEventListener('mousedown', (e)=>{ if(e.target===overlay) closeModal(); });
  document.body.appendChild(overlay);
  requestAnimationFrame(()=> overlay.classList.add('open'));
}
function closeModal(){
  const m = document.getElementById('activeModal');
  if(m){ m.classList.remove('open'); setTimeout(()=>m.remove(),150); }
}
function confirmDialog(title, message, onConfirm){
  openModal(title, `<p style="color:var(--text-dim); font-size:13.5px; line-height:1.6;">${esc(message)}</p>`,
    `<button class="btn" onclick="closeModal()">Cancelar</button>
     <button class="btn btn-danger-ghost" id="confirmBtn">Confirmar</button>`);
  document.getElementById('confirmBtn').onclick = ()=>{ onConfirm(); closeModal(); };
}

/* ---------- Table state helper ---------- */
function getTableState(key, defaults={}){
  if(!STATE.tables[key]){
    STATE.tables[key] = Object.assign({ search:'', filters:{}, sortKey:null, sortDir:'asc', page:1, pageSize:8, selected:new Set() }, defaults);
  }
  return STATE.tables[key];
}
function setRoute(route){
  STATE.route = route;
  STATE.mobileOpen = false;
  renderApp();
}
window.setRoute = setRoute;

/* ================================================================
   NEXUS CMMS — MOTOR GENÉRICO DE TABLAS / CRUD
   Un solo motor reutilizado por todos los módulos: búsqueda,
   filtros, orden, paginación, selección múltiple y formularios.
================================================================= */
function getRows(cfg){
  let rows = DB[cfg.collection].slice();
  if(cfg.extraFilter) rows = rows.filter(cfg.extraFilter);
  return rows;
}
function applyTableProcessing(key, rows, cfg){
  const st = getTableState(key);
  // search
  if(st.search){
    const q = st.search.toLowerCase();
    rows = rows.filter(r => cfg.searchable.some(f => String(getField(r,f)??'').toLowerCase().includes(q)));
  }
  // filters
  (cfg.filters||[]).forEach(f=>{
    const val = st.filters[f.key];
    if(val){ rows = rows.filter(r => String(getField(r,f.key)) === String(val)); }
  });
  // sort
  if(st.sortKey){
    rows = rows.slice().sort((a,b)=>{
      let av = getField(a, st.sortKey), bv = getField(b, st.sortKey);
      if(av==null) av=''; if(bv==null) bv='';
      if(typeof av === 'number' && typeof bv === 'number') return st.sortDir==='asc'? av-bv : bv-av;
      av = String(av).toLowerCase(); bv = String(bv).toLowerCase();
      if(av<bv) return st.sortDir==='asc'? -1:1;
      if(av>bv) return st.sortDir==='asc'? 1:-1;
      return 0;
    });
  }
  const total = rows.length;
  const totalPages = Math.max(1, Math.ceil(total/st.pageSize));
  if(st.page>totalPages) st.page = totalPages;
  const start = (st.page-1)*st.pageSize;
  const pageRows = rows.slice(start, start+st.pageSize);
  return { pageRows, total, totalPages };
}
function getField(obj, path){
  return path.split('.').reduce((o,k)=> o? o[k] : undefined, obj);
}

function renderToolbar(key, cfg){
  const st = getTableState(key);
  const filterSelects = (cfg.filters||[]).map(f=>{
    const opts = f.options();
    return `<select class="select-field" onchange="onFilterChange('${key}','${f.key}',this.value)">
      <option value="">${esc(f.label)}: Todos</option>
      ${opts.map(o=>`<option value="${esc(o.value)}" ${st.filters[f.key]===o.value?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  }).join('');
  return `
  <div class="toolbar">
    <div class="tb-search">${ICONS.search}<input type="text" placeholder="Buscar en ${esc(cfg.title.toLowerCase())}..." value="${esc(st.search)}" oninput="onSearchInput('${key}',this.value)"/></div>
    ${filterSelects}
    <div class="spacer"></div>
    ${cfg.exportable!==false? `<button class="btn btn-sm" onclick="exportCSV('${key}')">${ICONS.download}Exportar CSV</button>`:''}
    ${cfg.creatable!==false? `<button class="btn btn-primary btn-sm" onclick="openRecordModal('${key}', null)">${ICONS.plus}${esc(cfg.newLabel||'Nuevo')}</button>`:''}
  </div>`;
}

function renderTablePage(key, cfg){
  const st = getTableState(key);
  const rows = getRows(cfg);
  const { pageRows, total, totalPages } = applyTableProcessing(key, rows, cfg);

  if(total===0){
    return renderToolbar(key,cfg) + `
    <div class="table-wrap"><div class="empty-state">
      ${ICONS[cfg.icon]||ICONS.box}
      <h4>Sin registros</h4>
      <p>${st.search || Object.values(st.filters).some(Boolean) ? 'No hay resultados para los filtros aplicados.' : (cfg.emptyText||'Aún no se han creado registros. Usa "Nuevo" para comenzar.')}</p>
    </div></div>`;
  }

  const thead = cfg.columns.map(c=>{
    const arrow = st.sortKey===c.key ? (st.sortDir==='asc'?'▲':'▼') : '';
    return `<th onclick="onSortClick('${key}','${c.key}')">${esc(c.label)} <span class="sort-arrow">${arrow}</span></th>`;
  }).join('');

  const tbody = pageRows.map(row=>{
    const tds = cfg.columns.map(c=> `<td>${c.render? c.render(row) : esc(getField(row,c.key)??'—')}</td>`).join('');
    return `<tr>
      ${tds}
      <td class="td-actions">
        ${cfg.onView? `<button class="icon-btn btn-sm" title="Ver" onclick="cfgAction('${key}','view','${row.id}')">${ICONS.search}</button>`:''}
        <button class="icon-btn btn-sm" title="Editar" onclick="openRecordModal('${key}','${row.id}')">${ICONS.edit}</button>
        <button class="icon-btn btn-sm" title="Eliminar" onclick="onDeleteClick('${key}','${row.id}')">${ICONS.trash}</button>
      </td>
    </tr>`;
  }).join('');

  const startN = (st.page-1)*st.pageSize+1, endN = Math.min(st.page*st.pageSize, total);
  let pageBtns = '';
  for(let p=1; p<=totalPages; p++){
    if(totalPages>7 && Math.abs(p-st.page)>2 && p!==1 && p!==totalPages){ if(p===2||p===totalPages-1) pageBtns+=`<span style="color:var(--text-faint);padding:0 2px;">…</span>`; continue; }
    pageBtns += `<button class="page-btn ${p===st.page?'active':''}" onclick="onPageClick('${key}',${p})">${p}</button>`;
  }

  return renderToolbar(key,cfg) + `
  <div class="table-wrap">
    <div style="overflow-x:auto;">
    <table><thead><tr>${thead}<th>Acciones</th></tr></thead><tbody>${tbody}</tbody></table>
    </div>
    <div class="table-footer">
      <span class="results-count">Mostrando ${startN}–${endN} de ${total} registros</span>
      <div class="pagination">
        <button class="page-btn" ${st.page<=1?'disabled':''} onclick="onPageClick('${key}',${st.page-1})">${ICONS.chevL}</button>
        ${pageBtns}
        <button class="page-btn" ${st.page>=totalPages?'disabled':''} onclick="onPageClick('${key}',${st.page+1})">${ICONS.chevR}</button>
      </div>
    </div>
  </div>`;
}

function onSearchInput(key, val){
  getTableState(key).search = val; getTableState(key).page = 1;
  clearTimeout(window.__searchDebounce);
  window.__searchDebounce = setTimeout(()=> rerenderContentOnly(), 180);
}
function onFilterChange(key, fkey, val){ getTableState(key).filters[fkey]=val; getTableState(key).page=1; renderApp(); }
function onSortClick(key, colKey){
  const st = getTableState(key);
  if(st.sortKey===colKey){ st.sortDir = st.sortDir==='asc'?'desc':'asc'; } else { st.sortKey=colKey; st.sortDir='asc'; }
  renderApp();
}
function onPageClick(key, p){ if(p<1) return; getTableState(key).page = p; renderApp(); }
function rerenderContentOnly(){
  // preserves focus in search input while filtering
  const active = document.activeElement;
  const isSearch = active && active.matches && active.matches('.tb-search input');
  const val = isSearch? active.value : null;
  const selStart = isSearch? active.selectionStart : null;
  renderApp();
  if(isSearch){
    const input = document.querySelector('.tb-search input');
    if(input){ input.focus(); input.setSelectionRange(selStart,selStart); }
  }
}

function onDeleteClick(key, id){
  const cfg = MODULES[key];
  confirmDialog('Eliminar registro', '¿Seguro que deseas eliminar este registro? Esta acción no se puede deshacer.', ()=>{
    const arr = DB[cfg.collection];
    const idx = arr.findIndex(r=>r.id===id);
    if(idx>-1) arr.splice(idx,1);
    toast('Registro eliminado correctamente');
    renderApp();
  });
}

function cfgAction(key, action, id){
  const cfg = MODULES[key];
  if(action==='view' && cfg.onView) cfg.onView(id);
}

/* ---------- Formularios genéricos (modal crear/editar) ---------- */
function fieldInputHtml(f, value){
  const val = value==null? (f.default!==undefined? f.default : '') : value;
  if(f.type==='select'){
    const opts = f.options();
    return `<select id="fld_${f.key}">
      <option value="">Seleccione...</option>
      ${opts.map(o=>`<option value="${esc(o.value)}" ${String(val)===String(o.value)?'selected':''}>${esc(o.label)}</option>`).join('')}
    </select>`;
  }
  if(f.type==='textarea'){
    return `<textarea id="fld_${f.key}" placeholder="${esc(f.placeholder||'')}">${esc(val)}</textarea>`;
  }
  if(f.type==='date'){
    return `<input type="date" id="fld_${f.key}" value="${esc(val)}"/>`;
  }
  if(f.type==='time'){
    return `<input type="time" id="fld_${f.key}" value="${esc(val)}"/>`;
  }
  if(f.type==='number'){
    return `<input type="number" step="${f.step||1}" id="fld_${f.key}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}"/>`;
  }
  return `<input type="text" id="fld_${f.key}" value="${esc(val)}" placeholder="${esc(f.placeholder||'')}"/>`;
}

function openRecordModal(key, id){
  const cfg = MODULES[key];
  const isEdit = !!id;
  const record = isEdit ? DB[cfg.collection].find(r=>r.id===id) : (cfg.newDefaults? cfg.newDefaults() : {});
  const fields = cfg.formFields;
  const body = `<div class="form-row">
    ${fields.map(f=>`
      <div class="form-group ${f.full?'full':''}" id="grp_${f.key}">
        <label>${esc(f.label)} ${f.required?'<span class="req">*</span>':''}</label>
        ${fieldInputHtml(f, record[f.key])}
        <span class="field-error">Este campo es obligatorio.</span>
      </div>`).join('')}
  </div>`;
  const foot = `
    <button class="btn" onclick="closeModal()">Cancelar</button>
    <button class="btn btn-primary" onclick="saveRecord('${key}', ${isEdit? `'${id}'`:'null'})">${ICONS.checkCircle} Guardar</button>`;
  openModal((isEdit? 'Editar: ':'Nuevo: ') + cfg.singular, body, foot, {width: cfg.modalWidth||'620px'});
}

function saveRecord(key, id){
  const cfg = MODULES[key];
  const fields = cfg.formFields;
  let valid = true;
  const data = {};
  fields.forEach(f=>{
    const el = document.getElementById('fld_'+f.key);
    let v = el.value;
    const grp = document.getElementById('grp_'+f.key);
    if(f.required && !v){ valid=false; grp.classList.add('invalid'); } else { grp.classList.remove('invalid'); }
    if(f.type==='number') v = v===''? null : Number(v);
    data[f.key] = v;
  });
  if(!valid){ toast('Completa los campos obligatorios', 'danger'); return; }
  if(cfg.beforeSave){ const err = cfg.beforeSave(data, id); if(err){ toast(err,'danger'); return; } }

  if(id){
    const arr = DB[cfg.collection];
    const idx = arr.findIndex(r=>r.id===id);
    arr[idx] = Object.assign({}, arr[idx], data);
  } else {
    data.id = newId(cfg.idPrefix||'x');
    if(cfg.onCreateExtra) cfg.onCreateExtra(data);
    DB[cfg.collection].push(data);
  }
  closeModal();
  toast(id? 'Registro actualizado correctamente' : 'Registro creado correctamente');
  renderApp();
}

/* ---------- Exportar CSV ---------- */
function exportCSV(key){
  const cfg = MODULES[key];
  const rows = getRows(cfg);
  const cols = cfg.columns;
  const header = cols.map(c=>c.label).join(',');
  const lines = rows.map(r=> cols.map(c=>{
    let v = getField(r,c.key);
    v = (v==null? '' : String(v)).replace(/"/g,'""');
    return `"${v}"`;
  }).join(','));
  const csv = [header, ...lines].join('\n');
  const blob = new Blob(["\ufeff"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${key}_export.csv`; a.click();
  URL.revokeObjectURL(url);
  toast('Exportación CSV generada');
}

/* ================================================================
   NEXUS CMMS — HELPERS DE REFERENCIA (lookup entre tablas)
================================================================= */
function areaName(id){ const a = DB.areas.find(x=>x.id===id); return a? a.nombre : '—'; }
function equipoName(id){ const e = DB.equipos.find(x=>x.id===id); return e? `${e.codigo} · ${e.nombre}` : '—'; }
function usuarioName(id){ const u = DB.usuarios.find(x=>x.id===id); return u? u.nombre : '—'; }
function opt(arr, valueKey, labelFn){ return arr.map(x=>({value:x[valueKey], label:labelFn(x)})); }
function enumOpts(dict){ return Object.entries(dict).map(([value,label])=>({value,label})); }

/* ================================================================
   NEXUS CMMS — REGISTRO DE MÓDULOS (configuración CRUD por módulo)
================================================================= */
const MODULES = {};

MODULES.ordenes = {
  collection:'ordenes', idPrefix:'ot', title:'Órdenes de Trabajo', singular:'Orden de Trabajo', icon:'clipboard', newLabel:'Nueva OT',
  searchable:['numeroOT','descripcion','elemento'],
  filters:[
    { key:'estado', label:'Estado', options:()=>enumOpts(LABELS.estadoOT) },
    { key:'prioridad', label:'Prioridad', options:()=>enumOpts(LABELS.prioridad) },
    { key:'tipoMantenimiento', label:'Tipo', options:()=>enumOpts(LABELS.tipoMant) },
    { key:'areaId', label:'Área', options:()=>opt(DB.areas,'id',a=>a.nombre) },
    { key:'semana', label:'Semana', options:()=> WEEKS.map(w=>({value:String(w.n), label:'Semana '+w.n})) },
  ],
  columns:[
    { key:'numeroOT', label:'N° OT', render:r=>`<span class="mono" style="font-weight:700;">${esc(r.numeroOT)}</span>` },
    { key:'fecha', label:'Fecha', render:r=>fmtDate(r.fecha) },
    { key:'horaInicio', label:'Horario', render:r=> r.horaInicio? `<span class="mono">${esc(r.horaInicio)}–${esc(r.horaFin||'—')}</span>` : '—' },
    { key:'duracionMinutos', label:'Duración', render:r=> r.duracionMinutos!=null? `${fmtNum(r.duracionMinutos/60,1)} h` : '—' },
    { key:'equipoId', label:'Equipo', render:r=>esc(equipoName(r.equipoId)) },
    { key:'tipoMantenimiento', label:'Tipo', render:r=>badge('tipoMant',r.tipoMantenimiento).replace('badge-neutral','badge-info') || esc(LABELS.tipoMant[r.tipoMantenimiento]) },
    { key:'prioridad', label:'Prioridad', render:r=>badge('prioridad', r.prioridad) },
    { key:'responsableId', label:'Responsable', render:r=>esc(usuarioName(r.responsableId)) },
    { key:'estado', label:'Estado', render:r=>badge('estadoOT', r.estado) },
  ],
  formFields:[
    { key:'numeroOT', label:'Número de OT', required:true, placeholder:'OT-00004' },
    { key:'fecha', label:'Fecha', type:'date', required:true },
    { key:'horaInicio', label:'Hora inicio', type:'time' },
    { key:'horaFin', label:'Hora final', type:'time' },
    { key:'areaId', label:'Área', type:'select', required:true, options:()=>opt(DB.areas,'id',a=>a.nombre) },
    { key:'equipoId', label:'Equipo', type:'select', required:true, options:()=>opt(DB.equipos,'id',e=>`${e.codigo} · ${e.nombre}`) },
    { key:'elemento', label:'Elemento', placeholder:'Ej. Rodamiento eje principal' },

<script>
/* ================================================================
   NEXUS CMMS — CÁSCARA DE LA APP (sidebar, topbar) Y ENRUTADOR
================================================================= */
function pageMeta(route){
  const item = NAV_FLAT.find(i=>i.id===route);
  const group = NAV.find(g=>g.items.some(i=>i.id===route));
  return { title: item? item.label : 'Dashboard', crumb: group? group.group : 'General' };
}

function renderSidebar(){
  const groups = NAV.map(g=>`
    <div class="nav-section-label">${esc(g.group)}</div>
    ${g.items.map(i=>`
      <div class="nav-item ${STATE.route===i.id?'active':''}" onclick="setRoute('${i.id}')" title="${esc(i.label)}">
        ${ICONS[i.icon]||ICONS.dot}<span class="label">${esc(i.label)}</span>
      </div>`).join('')}
  `).join('');
  return `
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">${ICONS.gauge}</div>
      <div class="brand-text"><b>NEXUS CMMS</b><span>Planta Industrial</span></div>
    </div>
    <nav class="sidebar-scroll">${groups}</nav>
  </aside>`;
}

function renderTopbar(){
  const meta = pageMeta(STATE.route);
  const initials = STATE.user.nombre.split(' ').map(s=>s[0]).slice(0,2).join('');
  return `
  <header class="topbar">
    <div class="topbar-left">
      <button class="icon-btn" onclick="toggleSidebar()">${ICONS.menu}</button>
      <div>
        <div class="page-title">${esc(meta.title)}</div>
        <div class="page-crumb">${esc(meta.crumb)} / ${esc(meta.title)}</div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="search-global">${ICONS.search}<input placeholder="Búsqueda rápida global..." onkeydown="if(event.key==='Enter') globalSearch(this.value)"/></div>
      <button class="icon-btn" onclick="toggleTheme()">${STATE.theme==='dark'? ICONS.sun : ICONS.moon}</button>
      <button class="icon-btn" title="Notificaciones">${ICONS.bell}</button>
      <div class="role-pill">${esc(LABELS.rol[STATE.user.rol]||STATE.user.rol)}</div>
      <div class="avatar" title="${esc(STATE.user.nombre)}">${esc(initials)}</div>
    </div>
  </header>`;
}

function toggleSidebar(){
  if(window.innerWidth<=1024){ STATE.mobileOpen = !STATE.mobileOpen; } else { STATE.sidebarCollapsed = !STATE.sidebarCollapsed; }
  renderApp();
}
function toggleTheme(){
  STATE.theme = STATE.theme==='dark'?'light':'dark';
  document.documentElement.classList.toggle('dark', STATE.theme==='dark');
  renderApp();
}
function globalSearch(q){
  if(!q) return;
  setRoute('ordenes');
  getTableState('ordenes').search = q;
  renderApp();
}

/* ---------- Página: contenedor genérico de módulo CRUD ---------- */
function renderCrudModulePage(key){
  const cfg = MODULES[key];
  return `
    <div class="section-head">
      <div class="section-title">${ICONS[cfg.icon]||ICONS.box}${esc(cfg.title)}</div>
    </div>
    ${renderTablePage(key, cfg)}
  `;
}

/* ---------- Página: Configuración (tabs: Áreas, Usuarios, Apariencia) ---------- */
STATE.configTab = 'areas';
function setConfigTab(t){ STATE.configTab = t; renderApp(); }
function renderConfiguracion(){
  const tabs = [ {id:'areas',label:'Áreas de Planta'}, {id:'usuarios',label:'Usuarios y Roles'}, {id:'apariencia',label:'Apariencia'} ];
  let body = '';
  if(STATE.configTab==='areas') body = renderTablePage('areas', MODULES.areas);
  else if(STATE.configTab==='usuarios') body = renderTablePage('usuarios', MODULES.usuarios);
  else body = `
    <div class="card card-pad" style="max-width:520px;">
      <h4 style="font-size:14px;margin-bottom:6px;">Tema de la interfaz</h4>
      <p style="font-size:12.5px;color:var(--text-dim);margin-bottom:14px;">Cambia entre modo claro y oscuro para toda la aplicación.</p>
      <button class="btn" onclick="toggleTheme()">${STATE.theme==='dark'?ICONS.sun:ICONS.moon} Cambiar a modo ${STATE.theme==='dark'?'claro':'oscuro'}</button>
    </div>`;
  return `
    <div class="section-head"><div class="section-title">${ICONS.settings}Configuración del Sistema</div></div>
    <div class="tabs">${tabs.map(t=>`<div class="tab-btn ${STATE.configTab===t.id?'active':''}" onclick="setConfigTab('${t.id}')">${esc(t.label)}</div>`).join('')}</div>
    ${body}
  `;
}

/* ---------- Página: Planificador de Estrategias de Mantenimiento ---------- */
function renderEstrategias(){
  const rows = DB.estrategias;
  const total = rows.length || 1;
  const activas = rows.filter(r=>r.estado==='EN_EJECUCION').length;
  const completadas = rows.filter(r=>r.estado==='COMPLETADA').length;
  const porTipo = Object.keys(LABELS.tipoEstrategia).map(t=>({ tipo:t, label:LABELS.tipoEstrategia[t], count: rows.filter(r=>r.tipo===t).length }));
  return `
    <div class="section-head"><div class="section-title">${ICONS.target}Planificador de Estrategias de Mantenimiento</div></div>
    <p style="font-size:13px;color:var(--text-dim);max-width:720px;margin-bottom:16px;">
      Define y da seguimiento a las estrategias de mantenimiento de la planta (RCM, TPM, preventivo por tiempo o condición, predictivo),
      con su objetivo, KPI meta, frecuencia de revisión y responsable.
    </p>
    <div class="stat-strip">
      <div class="stat-chip">${ICONS.target}Total: <b class="mono">${rows.length}</b></div>
      <div class="stat-chip">${ICONS.activity}En ejecución: <b class="mono" style="color:var(--info);">${activas}</b></div>
      <div class="stat-chip">${ICONS.checkCircle}Completadas: <b class="mono" style="color:var(--ok);">${completadas}</b></div>
    </div>
    <div class="grid grid-charts-2" style="margin-bottom:18px;">
      <div class="card chart-card"><div class="chart-head"><h4>Estrategias por tipo</h4></div><div class="chart-box sm"><canvas id="chartEstrategiasTipo"></canvas></div></div>
      <div class="card card-pad">

let __charts = {};
function destroyCharts(){ Object.values(__charts).forEach(c=>c && c.destroy && c.destroy()); __charts = {}; }

function kpiComputations(){
  const ordenes = DB.ordenes;
  const total = ordenes.length || 1;
  const completadas = ordenes.filter(o=>o.estado==='COMPLETADA').length;
  const preventivas = ordenes.filter(o=>o.tipoMantenimiento==='PREVENTIVO').length;
  const correctivas = ordenes.filter(o=>o.tipoMantenimiento==='CORRECTIVO').length; // = cantidad de fallos
  const planificado = ordenes.filter(o=>o.tipoMantenimiento!=='CORRECTIVO').length;
  const noPlanificado = correctivas;

  const horasProductivas = ordenes.filter(o=>o.tipoMantenimiento!=='CORRECTIVO')
    .reduce((s,o)=> s + durationHours(o.horaInicio,o.horaFin), 0);
  const horasParo = ordenes.filter(o=>o.tipoMantenimiento==='CORRECTIVO')
    .reduce((s,o)=> s + durationHours(o.horaInicio,o.horaFin), 0);

  const disponibilidad = Math.round((horasProductivas/(horasProductivas+horasParo))*1000)/10;
  const cumplimiento = Math.round((completadas/total)*100);
  const cantidadFallos = correctivas;
  const mttr = cantidadFallos? Math.round((horasParo/cantidadFallos)*100)/100 : 0; // Tiempo Medio de Reparación
  const tmf = cantidadFallos? Math.round((horasProductivas/cantidadFallos)*10)/10 : 0; // Tiempo Medio entre Fallas (MTBF)
  const stockCritico = DB.repuestos.filter(r=>r.cantidad<=r.stockCritico).length;

  return { horasParo, horasProductivas, disponibilidad, cumplimiento, preventivas, correctivas,
    planificado, noPlanificado, tmf, mttr, cantidadFallos, stockCritico, completadas, total };
}

/* ---------- Estadísticas semanales (según el plan de 8 semanas) ---------- */
function computeWeeklyStats(){
  const total = DB.ordenes.length || 1;
  return WEEKS.map(w=>{
    const rows = DB.ordenes.filter(o=> DATE_TO_WEEK[o.fecha]===w.n);
    const horas = rows.reduce((s,o)=> s + durationHours(o.horaInicio,o.horaFin), 0);
    const fallos = rows.filter(o=>o.tipoMantenimiento==='CORRECTIVO').length;
    const productivas = rows.filter(o=>o.tipoMantenimiento!=='CORRECTIVO').reduce((s,o)=> s + durationHours(o.horaInicio,o.horaFin), 0);
    const paro = rows.filter(o=>o.tipoMantenimiento==='CORRECTIVO').reduce((s,o)=> s + durationHours(o.horaInicio,o.horaFin), 0);
    return {
      semana:w.n, rango:`${fmtDate(w.dias[0])} – ${fmtDate(w.dias[w.dias.length-1])}`,
      otCount: rows.length, pct: Math.round((rows.length/total)*1000)/10,
      horas: Math.round(horas*10)/10, productivas: Math.round(productivas*10)/10, paro: Math.round(paro*10)/10, fallos,
    };
  });
}

  return `

    <div class="kpi-top">
      <div>

        <div><span class="kpi-value">${value}</span><span class="kpi-unit">${esc(unit||'')}</span></div>

function chartFallback(canvasId, msg){
  const canvas = document.getElementById(canvasId);
  if(canvas && canvas.parentElement){
    canvas.parentElement.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-faint);font-size:12px;text-align:center;padding:10px;line-height:1.5;">${esc(msg)}</div>`;
  }
}
function safeChart(id, factory){
  try{ return factory(); }
  catch(err){
    console.error('[NEXUS CMMS] Error al generar la gráfica '+id, err);
    chartFallback(id, 'No se pudo generar esta gráfica (' + (err && err.message ? err.message : 'error desconocido') + ').');
    return null;
  }
}

function paintDashboardCharts(){

    ['chartSemanalOT','chartSemanalHoras','chartHoras','chartDisp','chartPvC','chartPlan','chartEstado','chartCostos','chartIncid']

    return;

  destroyCharts();
  const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--border-soft');
  const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-dim');
  Chart.defaults.color = textColor.trim() || '#5b6472';
  Chart.defaults.font.family = 'Inter';
  Chart.defaults.borderColor = gridColor.trim() || '#e7eaef';

  const semanas = computeWeeklyStats();

    { label:'% del total', data:semanas.map(s=>s.pct), type:'line', borderColor:'#f2a339', backgroundColor:'#f2a339', tension:.35, yAxisID:'y1' },
  ]}, options:{ responsive:true, maintainAspectRatio:false,
    scales:{ y:{ beginAtZero:true, title:{display:true,text:'OT'} }, y1:{ type:'linear', position:'right', beginAtZero:true, grid:{drawOnChartArea:false}, title:{display:true,text:'%'} } },
    plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } } } }));

  __charts.semanalHoras = safeChart('chartSemanalHoras', ()=> new Chart(document.getElementById('chartSemanalHoras'), { type:'bar', data:{ labels:weekLabels, datasets:[

    { label:'Productivas', data:semanas.map(s=>s.productivas), backgroundColor:'#1a9c6b' },

  __charts.disp = safeChart('chartDisp', ()=> new Chart(document.getElementById('chartDisp'), { type:'line', data:{ labels:weekLabels, datasets:[

    { label:'Cumplimiento %', data:semanas.map(()=>100), borderColor:'#f2a339', backgroundColor:'#f2a33922', tension:.35, fill:true },
  ]}, options:{ responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:10, font:{size:11} } } } } }));

  const k = kpiComputations();
  __charts.pvc = safeChart('chartPvC', ()=> new Chart(document.getElementById('chartPvC'), { type:'doughnut', data:{ labels:['Preventivo','Correctivo'], datasets:[{ data:[k.preventivas||1, k.correctivas||1], backgroundColor:['#0e7c8f','#d8443a'] }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}} } }));
  __charts.plan = safeChart('chartPlan', ()=> new Chart(document.getElementById('chartPlan'), { type:'doughnut', data:{ labels:['Planificado','No planificado'], datasets:[{ data:[k.planificado||1, k.noPlanificado||1], backgroundColor:['#1a9c6b','#f2a339'] }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}} } }));

  const estados = ['PENDIENTE','EN_PROGRESO','PAUSADA','COMPLETADA','CANCELADA'];
  const estadoCounts = estados.map(e=> DB.ordenes.filter(o=>o.estado===e).length);
  __charts.estado = safeChart('chartEstado', ()=> new Chart(document.getElementById('chartEstado'), { type:'bar', data:{ labels:estados.map(e=>LABELS.estadoOT[e]), datasets:[{ data:estadoCounts, backgroundColor:['#8891a0','#2f6fd6','#f2a339','#1a9c6b','#d8443a'] }] }, options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y', plugins:{legend:{display:false}} } }));

  const costoLabels = ['Mano de obra','Materiales','Repuestos','Serv. externos'];
  const costoData = [
    DB.costos.reduce((s,c)=>s+Number(c.manoDeObra),0),
    DB.costos.reduce((s,c)=>s+Number(c.materiales),0),
    DB.costos.reduce((s,c)=>s+Number(c.repuestos),0),
    DB.costos.reduce((s,c)=>s+Number(c.serviciosExternos),0),
  ];
  __charts.costos = safeChart('chartCostos', ()=> new Chart(document.getElementById('chartCostos'), { type:'bar', data:{ labels:costoLabels, datasets:[{ data:costoData, backgroundColor:'#0e7c8f' }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}} } }));

  const critCounts = ['BAJA','MEDIA','ALTA'].map(c=> DB.incidencias.filter(i=>i.criticidad===c).length);
  __charts.incid = safeChart('chartIncid', ()=> new Chart(document.getElementById('chartIncid'), { type:'pie', data:{ labels:['Baja','Media','Alta'], datasets:[{ data:critCounts, backgroundColor:['#8891a0','#f2a339','#d8443a'] }] }, options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}} } }));
}

function paintEstrategiasChart(){
  if(typeof Chart==='undefined'){ chartFallback('chartEstrategiasTipo','No se pudo cargar Chart.js desde el CDN.'); return; }
  if(__charts.estrategiasTipo){ try{ __charts.estrategiasTipo.destroy(); }catch(e){} }
  const porTipo = Object.keys(LABELS.tipoEstrategia).map(t=>({ label:LABELS.tipoEstrategia[t], count: DB.estrategias.filter(r=>r.tipo===t).length }));
  __charts.estrategiasTipo = safeChart('chartEstrategiasTipo', ()=> new Chart(document.getElementById('chartEstrategiasTipo'), {
    type:'bar', data:{ labels:porTipo.map(p=>p.label), datasets:[{ data:porTipo.map(p=>p.count), backgroundColor:'#0e7c8f' }] },
    options:{ responsive:true, maintainAspectRatio:false, indexAxis:'y', plugins:{legend:{display:false}} } }));
}

function paintAuditoriaChart(){
  if(typeof Chart==='undefined'){ chartFallback('chartAuditoria','No se pudo cargar Chart.js desde el CDN.'); return; }
  if(__charts.auditoria){ try{ __charts.auditoria.destroy(); }catch(e){} }
  const counts = ['CONFORME','OBSERVACION','NO_CONFORME'].map(c=> DB.auditorias.filter(a=>a.cumplimiento===c).length);
  __charts.auditoria = safeChart('chartAuditoria', ()=> new Chart(document.getElementById('chartAuditoria'), {
    type:'doughnut', data:{ labels:['Conforme','Observación','No conforme'], datasets:[{ data:counts, backgroundColor:['#1a9c6b','#f2a339','#d8443a'] }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom',labels:{boxWidth:10,font:{size:11}}}} } }));
}

/* ---------- Router principal ---------- */
function renderPageContent(){
  switch(STATE.route){
    case 'dashboard': return renderDashboard();
    case 'estrategias': return renderEstrategias();
    case 'auditoria': return renderAuditoria();
    case 'costos': return renderCostos();
    case 'presupuesto': return renderPresupuesto();
    case 'reportes': return renderReportes();
    case 'configuracion': return renderConfiguracion();
    default:
      if(MODULES[STATE.route]) return renderCrudModulePage(STATE.route);
      if(STATE.route==='inventario') return renderCrudModulePage('repuestos');
      return `<div class="placeholder-module"><div class="pm-icon">${ICONS.box}</div><h3>Módulo no encontrado</h3><p>La sección solicitada no existe.</p></div>`;
  }
}
// map sidebar id 'inventario' -> module 'repuestos'
NAV_FLAT.find(i=>i.id==='inventario');

function renderApp(){
  const root = document.getElementById('app');
  root.className = 'app' + (STATE.sidebarCollapsed?' collapsed':'') + (STATE.mobileOpen?' mobile-open':'');
  const route = STATE.route==='inventario' ? 'repuestos' : STATE.route;
  const contentHtml = (STATE.route==='inventario') ? renderCrudModulePage('repuestos') : renderPageContent();
  root.innerHTML = `
    ${renderSidebar()}
    <div class="main">
      ${renderTopbar()}
      <div class="content">${contentHtml}</div>
    </div>
  `;
  if(STATE.route==='dashboard'){ setTimeout(paintDashboardCharts, 0); }
  else if(STATE.route==='estrategias'){ setTimeout(paintEstrategiasChart, 0); }
  else if(STATE.route==='auditoria'){ setTimeout(paintAuditoriaChart, 0); }
}

/* ---------- Inicialización ---------- */
document.addEventListener('DOMContentLoaded', ()=>{
  renderApp();
});
</script>
